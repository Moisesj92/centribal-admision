# Plantilla común: misma imagen y el proyecto montado en /app.
x-python: &python
  build: .
  image: centribal-admision
  pull_policy: build     # la imagen se construye aquí, no se descarga
  volumes:
    - .:/app

services:
  # Aplicación Django → UI en http://localhost:8000/ui/, API en /tickets/, admin en /admin/
  web:
    <<: *python
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  # Terminal para ejercicios, tests y debug: docker compose run --rm --service-ports shell
  shell:
    <<: *python
    ports:
      - "5678:5678"   # debugpy
    stdin_open: true
    tty: true
    profiles: ["tools"]   # no arranca con "docker compose up", solo con "run"
