# Uso:
#   docker compose up -d           → http://localhost:8000 (migra, crea la demo y arranca)
#   docker compose watch           igual, y reconstruye solo al cambiar requirements.txt
#   docker compose run --rm shell  terminal (tests, ejercicios, manage.py…)

# Configuración común: misma imagen y el código del ordenador montado en /app.
x-app: &app
  build: .
  image: centribal-admision
  pull_policy: build      # la imagen se construye aquí, no se busca en Docker Hub
  volumes:
    - .:/app

services:
  # La aplicación: web en /, API en /api/, admin en /admin/. Recarga sola al guardar.
  web:
    <<: *app
    # Al arrancar: migraciones → usuarios y tickets de demo (idempotente) → servidor.
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py preparar_demo
      && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    # "healthy" en docker compose ps cuando la app ya responde.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud/')"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    develop:
      watch:
        - action: rebuild
          path: requirements.txt

  # Terminal para tests, ejercicios y debug. No arranca con "up", solo con "run".
  shell:
    <<: *app
    command: bash
    ports:
      - "5678:5678"       # debugpy (con --service-ports)
    stdin_open: true
    tty: true
    profiles: ["tools"]
