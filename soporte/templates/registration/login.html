{% extends "soporte/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<div class="panel" style="max-width: 400px; margin: 0 auto">
  <h1>Acceso de agentes</h1>
  {% if next and user.is_authenticated %}<p class="errorlist">Tu usuario no es agente.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label for="{{ form.username.id_for_label }}">Usuario</label>{{ form.username }}
    <label for="{{ form.password.id_for_label }}">Contraseña</label>{{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <p style="margin-top: 16px"><button>Entrar</button></p>
  </form>
</div>
{% endblock %}
